# pnpm settings (pnpm 10+ reads these here, not from package.json's "pnpm" field).

# Force patched versions tree-wide to keep `pnpm audit` clean — past next-auth's
# nodemailer peer cap and over Next's bundled postcss/sharp. See AGENTS.md.
overrides:
  nodemailer: '^9.0.3'
  postcss: '^8.5.22'
  sharp: '^0.35.3'

# Dependencies allowed to run install/build scripts (pnpm blocks these by
# default). These need their native binaries: sharp (image processing), esbuild
# (used by Vitest), mongodb-memory-server (downloads mongod for tests/E2E), and
# the native resolver used by ESLint.
allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  sharp: true
  unrs-resolver: true
