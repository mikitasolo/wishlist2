name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Fail a hung run instead of letting it burn GitHub's 6-hour default. The
    # slowest recent healthy run took 2.7 min, so 15 leaves 5x headroom for a
    # slow npm registry and a growing test suite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs the full Vitest suite with coverage, so a drop below the
      # thresholds ratchet in vitest.config.mts fails the job.
      - name: Test (with coverage thresholds)
        run: npm run test:cov

      - name: Build
        run: npm run build
        # Several modules validate/read env at import time (lib/auth ->
        # getEnvVars, lib/mongodb). The build never connects to the DB or sends
        # mail, so dummy values are enough to let route modules import cleanly.
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_PORT: '587'
          SMTP_SECURE: 'false'
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          EMAIL_FROM: ci@example.com
          MIGRATION_SECRET: ci-migration-secret

      # The build's output file trace must ship sharp's native libvips with
      # every API route that ships sharp's binding. Without it those routes
      # crash on Vercel with ERR_DLOPEN_FAILED (WIS-156: sign-in and uploads
      # returned 500). Runs on Linux, like Vercel, so it checks the linux-x64 libs.
      - name: Check sharp's native library is traced
        run: npm run check:trace
