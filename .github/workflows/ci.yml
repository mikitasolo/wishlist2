name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        # Several modules validate/read env at import time (lib/auth ->
        # getEnvVars, lib/mongodb). The build never connects to the DB or sends
        # mail, so dummy values are enough to let route modules import cleanly.
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_PORT: '587'
          SMTP_SECURE: 'false'
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          EMAIL_FROM: ci@example.com
          MIGRATION_SECRET: ci-migration-secret
