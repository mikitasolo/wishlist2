name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs the full Vitest suite with coverage, so a drop below the
      # thresholds ratchet in vitest.config.ts fails the job.
      - name: Test (with coverage thresholds)
        run: npm run test:cov

      - name: Build
        run: npm run build
        # Several modules validate/read env at import time (lib/auth ->
        # getEnvVars, lib/mongodb). The build never connects to the DB or sends
        # mail, so dummy values are enough to let route modules import cleanly.
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_PORT: '587'
          SMTP_SECURE: 'false'
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          EMAIL_FROM: ci@example.com
          MIGRATION_SECRET: ci-migration-secret
