name: Release notification

# `main` only ever moves by `npm run release` fast-forwarding it to `staging`,
# so a push here *is* a release and `before..after` is exactly what shipped.
on:
  push:
    branches: [main]

# Never let two releases interleave their announcements.
concurrency:
  group: release-notify
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    # A failed announcement must not read as a failed release — the deploy has
    # already happened by this point and nothing here gates it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the changelog walks `before..after`.
          fetch-depth: 0

      - name: Post release notes to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        # Skips itself with a printed preview when the secrets aren't configured.
        run: python3 .github/scripts/telegram-release-notes.py
