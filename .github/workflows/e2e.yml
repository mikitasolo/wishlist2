name: E2E

on:
  push:
    branches: [main, staging]
  pull_request:

# Separate from the main CI workflow: E2E downloads a browser and builds the
# app, so it's kept out of the fast required checks.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Fail a hung run instead of letting it burn GitHub's 6-hour default. The
    # slowest recent healthy run took 9 min (a slow browser install, below),
    # so 30 leaves 3x headroom and must stay above the install step's own 20.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        # Usually ~30 s, but --with-deps pulls ~32 MB from the Ubuntu apt
        # mirror, which has taken up to 7.6 min in a run that then passed
        # (and hung past 11 min once). 20 is 2.6x the slowest healthy install
        # and names this step as the one that timed out.
        timeout-minutes: 20

      - name: Run E2E tests
        # global-setup boots an ephemeral MongoDB (mongodb-memory-server) and the
        # app itself, so no external services or secrets are needed.
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
