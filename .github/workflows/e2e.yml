name: E2E

on:
  push:
    branches: [main, staging]
  pull_request:

# Separate from the main CI workflow: E2E downloads a browser and builds the
# app, so it's kept out of the fast required checks.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-26.04
    # Fail a hung run instead of letting it burn GitHub's 6-hour default. The
    # slowest recent healthy run took 9 min (a slow browser install, below),
    # so 30 leaves 3x headroom and must stay above the install step's own 20.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # The browser only, without --with-deps: the runner image already has
        # every library Chromium links against. --with-deps only added package
        # upgrades and fallback fonts for scripts the suite never shows (Latin,
        # Cyrillic and emoji render pixel-identical without them; CJK and Thai
        # don't, so restore it if a test ever screenshots those), yet its
        # ~35 MB apt download has taken up to 7.6 min on a slow Ubuntu mirror
        # (and hung past 11 min once). If a future image drops a library, ldd
        # reports it and the apt install runs after all.
        run: |
          npx playwright install chromium
          browsers=~/.cache/ms-playwright
          if ! libs=$(ldd "$browsers"/chromium-*/chrome-linux64/chrome \
            "$browsers"/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell) ||
            grep 'not found' <<<"$libs"; then
            echo "::warning::The runner image lacks libraries Chromium needs; installing them with apt"
            npx playwright install-deps chromium
          fi
        # Sized for that apt fallback: 20 is 2.6x the slowest healthy
        # --with-deps install, and names this step if one hangs.
        timeout-minutes: 20

      - name: Run E2E tests
        # global-setup boots an ephemeral MongoDB (mongodb-memory-server) and the
        # app itself, so no external services or secrets are needed.
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
