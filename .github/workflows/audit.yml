name: Audit

# The only workflow left (WIS-419 removed the PR CI: the free Actions minutes
# ran out every month). It runs:
# - weekly, on the default branch (staging), to catch an advisory published
#   against something we already ship (WIS-140: a critical Next.js RCE sat on
#   staging unnoticed until someone ran `npm audit` by hand). GitHub emails a
#   failed scheduled run to whoever last changed the cron line. Minute 17
#   avoids the top-of-the-hour queue, where scheduled runs get delayed.
# - on demand (workflow_dispatch), e.g. to confirm a fix.
# A PR that changes dependencies runs `npm audit --omit=dev --audit-level=high`
# by hand instead (no PR trigger, to spend only a few minutes a month).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A manual run cancels an in-flight one on the same ref.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    # Fail a hung run instead of letting it burn GitHub's 6-hour default. The
    # audit is one registry request and takes seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `cache: npm` and no `npm ci`: --package-lock-only audits the
      # lockfile alone, with the same findings as an audit of the installed tree.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Informational only, never fails the job: dev-only findings don't ship,
      # and the known ones are listed (with their follow-ups) in docs/agents/backend.md.
      - name: Full audit report (all dependencies, dev included)
        run: |
          report=$(npm audit --package-lock-only) || true
          echo "$report"
          {
            echo '## `npm audit` (all dependencies, dev included)'
            echo
            echo '```text'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate: fails on any high or critical advisory in the runtime tree,
      # i.e. in code that ships to production. Moderate/low findings and
      # dev-only ones (eslint, vitest, ...) are left to the report above and
      # the exceptions list in docs/agents/backend.md. A registry outage fails it too: re-run.
      - name: Fail on a high or critical runtime advisory
        run: npm audit --package-lock-only --omit=dev --audit-level=high
